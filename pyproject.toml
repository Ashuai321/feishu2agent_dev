[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu2agents"
version = "3.0.0"
description = "Feishu2Agents Cloudflare Python Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Cloudflare Python Workers support asynchronous HTTP clients. Keep this
    # in the runtime dependency set so Feishu and Relay calls are bundled.
    "httpx>=0.27,<1",
    "certifi>=2025.1.31",
]

[project.optional-dependencies]
dev = [
    "lark-oapi>=1.7.3,<2",
    "python-dotenv>=1.0,<2",
    "fastmcp>=3.2.4,<4",
    "uvicorn>=0.30,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

# Cloudflare Workers Builds runs `uv run pywrangler deploy` without enabling
# project extras. Keep the Worker toolchain in uv's default development group
# so the deploy command is available in the remote build environment.
[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[project.scripts]
feishu2agents = "feishu2agents.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.package-data]
feishu2agents = ["frontend/dist/**"]
