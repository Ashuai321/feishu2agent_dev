[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2feishu"
version = "1.0.0"
description = "A Feishu long-connection echo bot with a clean Agent integration boundary"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lark-oapi>=1.7.3,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
gpt2feishu = "gpt2feishu.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
