[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu2agents"
version = "1.0.0"
description = "A Feishu long-connection echo bot with a clean Agent integration boundary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lark-oapi>=1.7.3,<2",
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
    "certifi>=2025.1.31",
    "fastmcp>=3.2.4,<4",
    "uvicorn>=0.30,<1",
    # Relay、OAuth、MCP server、存储和 API 已内置于 feishu2agents.relay。
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
feishu2agents = "feishu2agents.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.package-data]
feishu2agents = ["frontend/dist/**"]
